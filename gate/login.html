<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f1d1a'/><path d='M12 9.5v13l11-6.5z' fill='white'/></svg>" />
    <title>Dystory</title>
    <script>
      try {
        const t = localStorage.getItem("dystory.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <style>
      /* Same palette as src/index.css. */
      :root {
        --bg: #f7f5f2;
        --surface: #ffffff;
        --ink: #1f1d1a;
        --muted: #8a847b;
        --line: #e4dfd7;
        --line-strong: #d3ccc1;
        --accent: #2f5bd3;
        --danger: #c2410c;
        --logo: #1f1d1a;
        --shadow-lg: 0 2px 6px rgb(31 29 26 / 0.06), 0 24px 48px -12px rgb(31 29 26 / 0.22);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #151517;
          --surface: #1d1d20;
          --ink: #ecebe8;
          --muted: #8b8882;
          --line: #2d2d31;
          --line-strong: #3b3b40;
          --accent: #7ea2ff;
          --danger: #f97316;
          --logo: #34343a;
          --shadow-lg: 0 2px 6px rgb(0 0 0 / 0.4), 0 24px 48px -12px rgb(0 0 0 / 0.6);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #151517;
        --surface: #1d1d20;
        --ink: #ecebe8;
        --muted: #8b8882;
        --line: #2d2d31;
        --line-strong: #3b3b40;
        --accent: #7ea2ff;
        --danger: #f97316;
        --logo: #34343a;
        --shadow-lg: 0 2px 6px rgb(0 0 0 / 0.4), 0 24px 48px -12px rgb(0 0 0 / 0.6);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px 28px 28px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        text-align: center;
      }
      .logo {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 12px;
        background: var(--logo);
      }
      h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
      p.lede { margin: 0 0 24px; color: var(--muted); }
      form { display: grid; gap: 12px; text-align: left; }
      .field { position: relative; }
      input[type="password"], input[type="text"] {
        width: 100%;
        height: 44px;
        padding: 0 44px 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 16px; /* 16px keeps iOS from zooming in on focus */
        outline: none;
        transition: border-color 120ms, box-shadow 120ms;
      }
      input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
      input[aria-invalid="true"] { border-color: var(--danger); }
      .reveal {
        position: absolute;
        top: 4px;
        right: 4px;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      .reveal:hover { color: var(--ink); }
      .reveal:focus-visible { outline: 2px solid var(--accent); }
      .reveal .hide { display: none; }
      .reveal[aria-pressed="true"] .show { display: none; }
      .reveal[aria-pressed="true"] .hide { display: block; }
      .error { margin: 0; color: var(--danger); font-size: 14px; }
      button[type="submit"] {
        height: 44px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 120ms;
      }
      button[type="submit"]:hover { opacity: 0.88; }
      button[type="submit"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
      input.hidden-user {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 32 32"><path d="M10 6v20l17-10z" fill="white" /></svg>
      </div>
      <h1>Dystory</h1>
      <p class="lede">Enter the password to watch and comment.</p>
      <form method="post" action="/__gate/login">
        <input type="hidden" name="next" value="{{next}}" />
        <!-- Lets password managers file the saved password under a name. -->
        <input class="hidden-user" type="text" name="username" value="Dystory" autocomplete="username" tabindex="-1" aria-hidden="true" readonly />
        <div class="field">
          <input id="password" type="password" name="password" placeholder="Password" aria-label="Password"
            autocomplete="current-password" required autofocus {{invalid}} {{disabled}} />
          <button class="reveal" type="button" aria-label="Show password" aria-pressed="false">
            <svg class="show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.2A10.4 10.4 0 0 1 12 4c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M14.1 14.1a3 3 0 0 1-4.2-4.2"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
        {{error}}
        <button type="submit" {{disabled}}>Continue</button>
      </form>
    </main>
    <script>
      const input = document.getElementById("password");
      const reveal = document.querySelector(".reveal");
      reveal.addEventListener("click", () => {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        reveal.setAttribute("aria-pressed", String(!showing));
        reveal.setAttribute("aria-label", showing ? "Show password" : "Hide password");
        input.focus();
      });
      document.querySelector("form").addEventListener("submit", (e) => {
        e.target.querySelector('button[type="submit"]').disabled = true;
      });
    </script>
  </body>
</html>
