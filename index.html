<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d97757'/><path d='M10 22V10h3v12zm6 0V10h4.5a3.5 3.5 0 0 1 1.4 6.7A3.6 3.6 0 0 1 20.5 22z' fill='white'/></svg>" />
    <title>Dynastory</title>
    <script>
      try {
        const t = localStorage.getItem("dystory.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
